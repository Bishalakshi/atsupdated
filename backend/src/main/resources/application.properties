server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ats_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File upload size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve uploaded files as static resources
spring.web.resources.static-locations=file:uploads/,classpath:/static/

# Comma-separated list of allowed frontend origins (used by CorsConfig / SecurityConfig)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT secret (override in production!)
app.jwt.secret=${APP_JWT_SECRET:mysecretkeymysecretkeymysecretkey123}

# Behind Render's proxy
server.forward-headers-strategy=framework

# Small connection pool for free-tier databases
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
